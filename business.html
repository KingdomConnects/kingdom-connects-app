<body>
  <a id="top"></a>
  <div class="page-wrap">

    <!-- Header injected by components.js -->
    <div id="header"></div>

    <main class="main-content" id="main">
      <section class="page-content">
        <div class="card">
          <h2 class="gold-metallic">Member Businesses</h2>
          <p>Search by name, description, category, or city.</p>

<div class="kc-search">
  <input
    type="search"
    id="searchInput"
    class="kc-search-input"
    placeholder="Search businesses..."
    aria-label="Search businesses"
  />
  <span class="kc-search-icon" aria-hidden="true"></span>
</div>

          <!-- Results -->
          <div id="businessList" class="card-list mt-16"></div>

          <!-- CTA -->
          <div class="mt-16">
            <a href="submit_business.html"
               class="action-button btn-gold"
               onclick="handleClick(this)">Submit Your Business</a>
          </div>
        </div>
      </section>
    </main>

    <!-- Footer injected by components.js -->
    <div id="footer"></div>
  </div>

  <!-- Header/Footer + menus -->
  <script src="./js/kc_path.js"></script>
<script src="./js/components.js">
 
<!-- Button sheen/press helpers (shared) -->
  <script>
    function handleClick(el){
      el.classList.add('is-pressed');
      el.classList.remove('clicked'); void el.offsetWidth;
      el.classList.add('clicked');
      setTimeout(() => el.classList.remove('is-pressed'), 140);
    }
  </script>

  <!-- Firestore + directory logic -->
  <script type="module">
    import { db } from './js/firebase-config.js';
    import { collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const businessList = document.getElementById("businessList");
    const searchInput  = document.getElementById("searchInput");

    let allBusinesses = [];
    let debounceTimer;

    // ------- helpers -------
    const H = (strings, ...vals) => strings.map((s,i)=>s+(vals[i]??"")).join("");

    function safe(v){ return (v || "").toString().trim(); }

    // UPDATED: robust URL normalizer to allow plain domains
    function cleanUrl(u){
      const s = safe(u).replace(/\s+/g, "");
      if (!s) return "";
      try {
        const hasScheme = /^https?:\/\//i.test(s);
        const url = new URL(hasScheme ? s : "https://" + s);
        return url.href; // always absolute
      } catch (e) {
        return ""; // if malformed, render nothing
      }
    }

    function showSkeleton(n=4){
      businessList.innerHTML = Array.from({length:n})
        .map(()=>'<div class="skeleton" aria-hidden="true"></div>').join('');
    }

    function renderBusinesses(data) {
      if (!data.length) {
        businessList.innerHTML = "<p>No businesses found. Try a different search.</p>";
        return;
      }
      businessList.innerHTML = data.map(biz => {
        const name = safe(biz.businessName) || "Unnamed Business";
        const desc = safe(biz.description) || "No description provided.";
        const cat  = safe(biz.category)    || "N/A";
        const city = safe(biz.city)        || "N/A";
        const phone = safe(biz.phone);
        const website = safe(biz.website);

        const phoneHTML = phone
          ? H`<a href="tel:${phone}">${phone}</a>`
          : "N/A";

        const siteHref = website ? cleanUrl(website) : "";
        const siteHTML = siteHref
          ? H`<p><strong>Website:</strong> <a href="${siteHref}" target="_blank" rel="noopener">${siteHref.replace(/^https?:\/\//,'')}</a></p>`
          : "";

        return H`
          <div class="business-card">
            <h3 class="biz-title">${name}</h3>
            <p>${desc}</p>
            <p><strong>Category:</strong> ${cat}</p>
            <p><strong>City:</strong> ${city}</p>
            <p><strong>Phone:</strong> ${phoneHTML}</p>
            ${siteHTML}
          </div>
        `;
      }).join('');
    }

    async function loadBusinesses() {
      try {
        showSkeleton();
        const snapshot = await getDocs(collection(db, "business_listings"));
        allBusinesses = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        renderBusinesses(allBusinesses);
      } catch (error) {
        console.error("🔥 Error loading businesses:", error);
        businessList.innerHTML = '<div class="error-box">⚠️ Error loading businesses. Please try again.</div>';
      }
    }

    // Debounced search
    searchInput.addEventListener("input", () => {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(() => {
        const term = searchInput.value.toLowerCase();
        const filtered = allBusinesses.filter(biz =>
          (safe(biz.businessName)).toLowerCase().includes(term) ||
          (safe(biz.description)).toLowerCase().includes(term) ||
          (safe(biz.category)).toLowerCase().includes(term) ||
          (safe(biz.city)).toLowerCase().includes(term)
        );
        renderBusinesses(filtered);
      }, 150);
    });

    loadBusinesses();
  </script>
</body>
</html>
