<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Church Directory – Kingdom Connects</title>
  <meta name="description" content="Browse churches in your area and connect with a local community.">
  <link rel="canonical" href="https://kingdomconnects.com/church_directory.html">

  <!-- Open Graph -->
  <meta property="og:title" content="Church Directory – Kingdom Connects">
  <meta property="og:description" content="Browse churches in your area and connect with a local community.">
  <meta property="og:url" content="https://kingdomconnects.com/church_directory.html">
  <meta property="og:image" content="https://kingdomconnects.com/assets/og-kingdom-connects.png">

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image">

  <!-- Favicon -->
  <link rel="icon" href="/assets/favicon.ico" type="image/x-icon">

  <!-- CSS (order matters, match index.html) -->
  <link rel="stylesheet" href="styles/layout.css?v=3">
  <link rel="stylesheet" href="styles/theme.css?v=3">
  <link rel="stylesheet" href="styles/buttons.css?v=1">
  <link rel="stylesheet" href="styles/forms.css?v=1">
  <link rel="stylesheet" href="styles/overrides.css?v=3">
</head>

<body>
  <a id="top"></a>
  <div class="page-wrap">

    <!-- Header injected by components.js -->
    <div id="header"></div>

    <main class="main-content" id="main">
      <section class="page-content">
        <div class="card">
          <h2 class="gold-metallic">Church Directory</h2>
          <p>Browse churches listed in the Kingdom Connects community.</p>

          <!-- Status + Results -->
          <div id="statusMessage" class="message" style="margin-top:0.5rem;"></div>
          <div id="churchList" class="card-list" style="margin-top:1rem;"></div>
        </div>
      </section>
    </main>

    <!-- Footer injected by components.js -->
    <div id="footer"></div>
  </div>

  <!-- Site components (header/footer, menu, toggle) -->
  <script src="js/components.js?v=21" defer></script>

  <!-- Firestore logic (kept as-is) -->
  <script type="module">
    import { db } from "./js/firebase-config.js";
    import { collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const churchList = document.getElementById("churchList");
    const statusMessage = document.getElementById("statusMessage");

    function card(html){ const d=document.createElement("div"); d.className="business-card"; d.innerHTML=html; return d; }
    function safe(v){ return (v ?? "").toString().trim(); }

    async function loadChurches(){
      statusMessage.textContent = "Loading churches…";
      try {
        const q = query(collection(db, "churches"), orderBy("name"));
        const snap = await getDocs(q);

        if (snap.empty) {
          statusMessage.textContent = "No churches found.";
          return;
        }
        statusMessage.textContent = "";

        const fr = document.createDocumentFragment();
        snap.forEach(doc => {
          const ch = doc.data();
          const name = safe(ch.name) || "Unnamed Church";
          const city = safe(ch.city);
          const denom = safe(ch.denomination);
          const website = safe(ch.website);

          const details = [
            city && `<p><strong>City:</strong> ${city}</p>`,
            denom && `<p><strong>Denomination:</strong> ${denom}</p>`,
            website && (() => {
              // Reuse the robust normalizer so plain domains work
              const s = website.replace(/\s+/g,"");
              try {
                const hasScheme = /^https?:\/\//i.test(s);
                const url = new URL(hasScheme ? s : "https://" + s);
                const href = url.href;
                return `<p><strong>Website:</strong> <a href="${href}" target="_blank" rel="noopener">${href.replace(/^https?:\/\//,'')}</a></p>`;
              } catch { return ""; }
            })()
          ].filter(Boolean).join("");

          fr.appendChild(card(`
            <h3 class="biz-title">${name}</h3>
            ${details || "<p>No additional details provided.</p>"}
          `));
        });
        churchList.innerHTML = "";
        churchList.appendChild(fr);
      } catch (error) {
        console.error("🔥 Error loading churches:", error);
        statusMessage.style.color = "orange";
        statusMessage.style.backgroundColor = "#330000";
        statusMessage.style.padding = "1rem";
        statusMessage.style.border = "1px solid red";
        statusMessage.style.borderRadius = "8px";
        statusMessage.innerHTML = `
          <strong>⚠️ Error loading churches:</strong><br/>
          ${error.message}<br/>
          <small style="color:#ccc">Check firebase-config.js, Firestore rules, or internet connectivity.</small>
        `;
      }
    }

    loadChurches();
  </script>
</body>
</html>
