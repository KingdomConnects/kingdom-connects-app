<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <!-- =========================================================
       Kingdom Connects — Submit Business (Version 6.1)
       ========================================================= -->
  <title>Submit Your Business – Kingdom Connects</title>
  <meta name="description" content="Add your business to the Kingdom Connects community directory. Free listings for faith-aligned members and local services.">
  <link rel="canonical" href="https://kingdomconnects.com/submit_business.html">

  <!-- Open Graph -->
  <meta property="og:title" content="Submit Your Business – Kingdom Connects">
  <meta property="og:description" content="Add your business to the Kingdom Connects directory.">
  <meta property="og:url" content="https://kingdomconnects.com/submit_business.html">
  <meta property="og:image" content="https://kingdomconnects.com/assets/og-kingdom-connects.png">

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Submit Your Business – Kingdom Connects">
  <meta name="twitter:description" content="Add your business to the Kingdom Connects directory.">
  <meta name="twitter:image" content="https://kingdomconnects.com/assets/og-kingdom-connects.png">

  <!-- SEO -->
  <meta name="keywords" content="Kingdom Connects, submit business, Christian directory, local listings, faith-based services">
  <meta name="author" content="Fluba Designs LLC">

  <!-- Core setup -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Resource hints -->
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
  <link rel="dns-prefetch" href="//www.gstatic.com">
  <link rel="dns-prefetch" href="//firestore.googleapis.com">

  <!-- Theme colors -->
  <meta name="theme-color" content="#081529" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#ffffff"  media="(prefers-color-scheme: light)">

  <!-- Favicon -->
  <link rel="icon" href="/assets/favicon.ico" type="image/x-icon">

  <!-- Styles (order critical and matching index/business) -->
  <link rel="stylesheet" href="styles/layout.css?v=3">
  <link rel="stylesheet" href="styles/theme.css?v=3">
  <link rel="stylesheet" href="styles/buttons.css?v=1">
  <link rel="stylesheet" href="styles/forms.css?v=1">
  <link rel="stylesheet" href="styles/overrides.css?v=3">

  <style>
    /* Simple success animation */
    .message.success {
      opacity: 0;
      color: var(--gold, #FFD700);
      font-weight: 700;
      margin-top: 1rem;
      text-align: center;
      transition: opacity .6s ease;
    }
    .message.success.visible { opacity: 1; }

    .message.error {
      color: #ff6b6b;
      font-weight: 700;
      margin-top: 1rem;
      text-align: center;
    }

    /* Website preview helper (uses existing .kc-help tone) */
    #websitePreview a {
      font-weight: 700;
      text-decoration: none;
    }
    #websitePreview a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <a id="top"></a>
  <div class="page-wrap">
    <!-- Header injected by components.js -->
    <div id="header"></div>

    <main class="main-content" id="main">
      <section class="page-content">
        <div class="card">
          <h2 class="gold-metallic">Submit Your Business</h2>
          <p>Join the Kingdom Connects community by adding your business below. Free listings for members.</p>

          <form id="businessForm" class="kc-form">
            <!-- =========================
                 Section 1: Business Details
                 ========================= -->
            <h3 class="gold">Business Details</h3>

            <div class="kc-field">
              <label class="kc-label" for="businessName">Business Name<span class="req">*</span></label>
              <input class="kc-input" type="text" id="businessName" name="businessName" required>
            </div>

            <div class="kc-field">
              <label class="kc-label" for="description">Brief Description<span class="req">*</span></label>
              <textarea class="kc-textarea" id="description" name="description" required></textarea>
            </div>

            <div class="kc-field grid-2">
              <div>
                <label class="kc-label" for="website">Website</label>
                <!-- text + url keyboard; no native URL validation -->
                <input class="kc-input"
                       type="text"
                       id="website"
                       name="website"
                       inputmode="url"
                       autocomplete="url"
                       placeholder="e.g. davebusiness.com">
                <!-- live preview (hidden until valid) -->
                <div id="websitePreview" class="kc-help" aria-live="polite" style="display:none;"></div>
              </div>
              <div>
                <label class="kc-label" for="phone">Phone<span class="req">*</span></label>
                <input class="kc-input" type="tel" id="phone" name="phone" required>
              </div>
            </div>

            <!-- =========================
                 Section 2: Location & Contact
                 ========================= -->
            <h3 class="gold">Location & Contact Info</h3>

            <div class="kc-field grid-2">
              <div>
                <label class="kc-label" for="yourName">Your Name<span class="req">*</span></label>
                <input class="kc-input" type="text" id="yourName" name="yourName" required>
              </div>
              <div>
                <label class="kc-label" for="email">Email<span class="req">*</span></label>
                <input class="kc-input" type="email" id="email" name="email" required>
              </div>
            </div>

            <div class="kc-field">
              <label class="kc-label" for="address1">Address Line 1</label>
              <input class="kc-input" type="text" id="address1" name="address1">
            </div>

            <div class="kc-field">
              <label class="kc-label" for="address2">Address Line 2</label>
              <input class="kc-input" type="text" id="address2" name="address2">
            </div>

            <div class="kc-field grid-3">
              <div>
                <label class="kc-label" for="city">City<span class="req">*</span></label>
                <input class="kc-input" type="text" id="city" name="city" required>
              </div>
              <div>
                <label class="kc-label" for="state">State<span class="req">*</span></label>
                <input class="kc-input" type="text" id="state" name="state" required>
              </div>
              <div>
                <label class="kc-label" for="zip">ZIP<span class="req">*</span></label>
                <input class="kc-input" type="text" id="zip" name="zip" required>
              </div>
            </div>

            <div class="kc-field">
              <label class="kc-label" for="churchId">Select Your Church<span class="req">*</span></label>
              <select class="kc-select" id="churchId" name="churchId" required>
                <option value="">-- Select --</option>
              </select>
            </div>

            <div class="kc-field" style="text-align:center; margin-top:2rem;">
              <button type="submit" class="action-button btn-gold">Submit Listing</button>
            </div>

            <div id="message" class="message"></div>
          </form>
        </div>
      </section>
    </main>

    <!-- Footer injected by components.js -->
    <div id="footer"></div>
  </div>

  <!-- Shared site scripts (match index/business) -->
  <script src="js/components.js?v=21" defer></script>

  <!-- Firebase + Form Logic -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, collection, getDocs, addDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD3Im6F3lWgMbJiA7plsDt_Rp9kCLTr6KU",
      authDomain: "kingdom-commerce.firebaseapp.com",
      projectId: "kingdom-commerce",
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Normalize URL so users can type "davebusiness.com" (no http required)
    function normalizeUrl(u){
      const s = (u || "").trim();
      if (!s) return "";
      if (/^https?:\/\//i.test(s)) return s;
      try { return new URL("https://" + s).href; } catch(e) { return ""; }
    }

    // Populate church dropdown
    const churchSelect = document.getElementById("churchId");
    getDocs(collection(db, "churches")).then(snapshot => {
      snapshot.forEach(doc => {
        const opt = document.createElement("option");
        opt.value = doc.id;
        opt.textContent = doc.data().name || "Unnamed Church";
        churchSelect.appendChild(opt);
      });
    }).catch(err => console.error("Error loading churches:", err));

    const form = document.getElementById("businessForm");
    const messageDiv = document.getElementById("message");

    // --- Live website preview (non-blocking, safe) ---
    const websiteInput = document.getElementById("website");
    const websitePreview = document.getElementById("websitePreview");

    let previewTimer;
    function updateWebsitePreview(){
      const href = normalizeUrl(websiteInput.value);
      // Only show when we successfully normalized to a valid absolute URL
      if (href) {
        websitePreview.style.display = "";
        websitePreview.innerHTML = `Preview: <a href="${href}" target="_blank" rel="noopener">${href.replace(/^https?:\/\//i,'')}</a>`;
      } else {
        websitePreview.style.display = "none";
        websitePreview.textContent = "";
      }
    }
    websiteInput.addEventListener("input", () => {
      clearTimeout(previewTimer);
      previewTimer = setTimeout(updateWebsitePreview, 200); // light debounce
    });
    websiteInput.addEventListener("blur", updateWebsitePreview);

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      messageDiv.textContent = "";
      messageDiv.className = "message";

      const formData = new FormData(form);
      const data = Object.fromEntries(formData.entries());

      try {
        await addDoc(collection(db, "business_listings"), {
          businessName: data.businessName,
          yourName: data.yourName,
          email: data.email,
          description: data.description,
          phone: data.phone,
          website: normalizeUrl(data.website),   // normalized here
          address1: data.address1,
          address2: data.address2,
          city: data.city,
          state: data.state,
          zip: data.zip,
          churchId: data.churchId,
          listing_status: "pending",
          pro_status: "free",
          created_at: new Date().toISOString()
        });

        messageDiv.textContent = "✅ Your listing was sent!";
        messageDiv.className = "message success visible";
        form.reset();
        websitePreview.style.display = "none";
        websitePreview.textContent = "";

      } catch (error) {
        console.error("Submission error:", error);
        messageDiv.textContent = "❌ Error: " + error.message;
        messageDiv.className = "message error";
      }
    });
  </script>
</body>
</html>
