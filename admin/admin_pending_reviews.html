<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin – Pending Reviews</title>

  <!-- Global CSS -->
  <link rel="stylesheet" href="../styles/layout.css">
  <link rel="stylesheet" href="../styles/theme.css">
  <link rel="stylesheet" href="../styles/buttons.css">
  <link rel="stylesheet" href="../styles/forms.css">
  <link rel="stylesheet" href="../styles/overrides.css">
</head>

<body>

  <!-- Shared header -->
  <div id="header" class="header"></div>

  <main class="main-content">
    <section class="page-content">
      <h1>Admin – Pending Reviews</h1>
      <div class="clear"></div>

      <div id="reviewList" class="kc-list">
        <p>Loading pending reviews...</p>
      </div>

      <div class="form-actions">
        <a class="action-button" href="./admin_dashboard.html">← Back to Admin Dashboard</a>
      </div>
    </section>
  </main>

  <!-- Shared footer -->
  <div id="footer" class="footer"></div>

  <!-- JS -->
  <script src="../js/components.js" defer></script>

  <!-- Firebase logic -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-app.js";
    import { firebaseConfig } from "../js/firebase-config.js";
    import { getFirestore, collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore.js";

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const reviewList = document.getElementById("reviewList");

    async function loadPendingReviews() {
      reviewList.innerHTML = "<p>Loading pending reviews...</p>";
      try {
        const q = query(collection(db, "reviews"), where("status", "==", "pending"));
        const snapshot = await getDocs(q);

        if (snapshot.empty) {
          reviewList.innerHTML = "<p>No pending reviews found.</p>";
          return;
        }

        let html = "";
        snapshot.forEach((docSnap) => {
          const data = docSnap.data();
          const submitted =
            data.timestamp?.seconds
              ? new Date(data.timestamp.seconds * 1000).toLocaleString()
              : "N/A";

          html += `
            <div class="kc-card">
              <strong>${data.business_name || "Unknown Business"}</strong><br>
              <span>Rating:</span> ${data.rating || "N/A"}<br>
              <span>Comment:</span> ${data.comment || ""}<br>
              <span>Submitted:</span> ${submitted}
            </div>`;
        });
        reviewList.innerHTML = html;
      } catch (err) {
        console.error(err);
        reviewList.innerHTML = "<p>Error loading pending reviews.</p>";
      }
    }

    window.addEventListener("DOMContentLoaded", loadPendingReviews);
  </script>
</body>
</html>
