<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin – Edit Business</title>

  <!-- Global CSS -->
  <link rel="stylesheet" href="../styles/layout.css">
  <link rel="stylesheet" href="../styles/theme.css">
  <link rel="stylesheet" href="../styles/buttons.css">
  <link rel="stylesheet" href="../styles/forms.css">
  <link rel="stylesheet" href="../styles/overrides.css">
</head>
<body>

  <!-- Header injected by components.js -->
  <div id="header"></div>

  <main class="main-content">
    <section class="page-content">
      <h1>Admin – Edit Business</h1>
      <div class="clear"></div>

      <!-- Form uses your forms.css hooks; IDs match common business fields -->
      <form id="editBusinessForm" class="kc-form" onsubmit="event.preventDefault(); saveChanges();">
        <div class="form-group">
          <label for="business_name" class="form-label">Business Name <span class="req">*</span></label>
          <div class="input-wrap">
            <input id="business_name" class="kc-input" type="text" placeholder="Business Name" required />
          </div>
        </div>

        <div class="form-group">
          <label for="description" class="form-label">Short Description</label>
          <div class="input-wrap">
            <textarea id="description" class="kc-input" rows="4" placeholder="Brief description"></textarea>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="category" class="form-label">Category</label>
            <div class="input-wrap">
              <input id="category" class="kc-input" type="text" placeholder="Category" />
            </div>
          </div>
          <div class="form-group">
            <label for="subcategory" class="form-label">Subcategory</label>
            <div class="input-wrap">
              <input id="subcategory" class="kc-input" type="text" placeholder="Subcategory" />
            </div>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="city" class="form-label">City</label>
            <div class="input-wrap">
              <input id="city" class="kc-input" type="text" placeholder="City" />
            </div>
          </div>
          <div class="form-group">
            <label for="state" class="form-label">State</label>
            <div class="input-wrap">
              <input id="state" class="kc-input" type="text" placeholder="State" />
            </div>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="phone" class="form-label">Phone</label>
            <div class="input-wrap">
              <input id="phone" class="kc-input" type="tel" placeholder="Phone" />
            </div>
          </div>
          <div class="form-group">
            <label for="website" class="form-label">Website</label>
            <div class="input-wrap">
              <input id="website" class="kc-input" type="text" inputmode="url" placeholder="example.com" />
            </div>
          </div>
        </div>

        <div class="form-group">
          <label for="contact_email" class="form-label">Contact Email</label>
          <div class="input-wrap">
            <input id="contact_email" class="kc-input" type="email" placeholder="email@example.com" />
          </div>
        </div>

        <div class="form-group">
          <label for="status" class="form-label">Status</label>
          <div class="input-wrap">
            <select id="status" class="kc-input">
              <option value="">(none)</option>
              <option value="pending">Pending</option>
              <option value="active">Active</option>
¹              <option value="inactive">Inactive</option>
              <option value="rejected">Rejected</option>
            </select>
         </div>
        </div>

        <div class="form-actions">
          <button type="submit" class="action-button">Save Changes</button>
        </div>

        <p id="resultMessage" class="form-note"></p>
      </form>

      <!-- Back button -->
      <button class="action-button" type="button" onclick="location.href='admin_dashboard.html'">
        ← Back to Admin Dashboard
      </button>
    </section>
  </main>

  <!-- Footer injected by components.js -->
  <div id="footer"></div>

  <!-- Module script (aligned with your original flow) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-app.js";
    import { firebaseConfig } from "../js/firebase-config.js";
    import { getFirestore, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore.js";

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const urlParams = new URLSearchParams(window.location.search);
    const docId = urlParams.get("id");

    async function loadBusinessData() {
      if (!docId) return;
      try {
        const ref = doc(db, "businesses", docId);
        const snap = await getDoc(ref);
        if (!snap.exists()) return;

        const data = snap.data();

        // Populate known fields if present
        const ids = ["business_name","description","category","subcategory","city","state","phone","website","status","contact_email"];
        ids.forEach(id => {
          if (data[id] !== undefined) {
            const el = document.getElementById(id);
            if (el) el.value = data[id];
          }
        });
      } catch (e) {
        console.error(e);
      }
    }

    async function saveChanges() {
      if (!docId) return;
      const msg = document.getElementById("resultMessage");
      msg.textContent = "Saving...";

      const payload = {};
      ["business_name","description","category","subcategory","city","state","phone","website","status","contact_email"]
        .forEach(id => {
          const el = document.getElementById(id);
          if (el && el.value !== undefined) payload[id] = el.value.trim ? el.value.trim() : el.value;
        });

      try {
        const ref = doc(db, "businesses", docId);
        await updateDoc(ref, payload);
        msg.textContent = "Saved.";
      } catch (e) {
        console.error(e);
        msg.textContent = "Error saving changes.";
      }
    }

    window.addEventListener("DOMContentLoaded", loadBusinessData);
    window.saveChanges = saveChanges; // used by inline onsubmit handler
  </script>

  <!-- Components injector -->
  <script src="../js/components.js" defer></script>
</body>
</html>
