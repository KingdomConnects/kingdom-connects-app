<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin – Create New Business</title>

  <!-- Global CSS (one level up from /admin/) -->
  <link rel="stylesheet" href="../styles/layout.css">
  <link rel="stylesheet" href="../styles/theme.css">
  <link rel="stylesheet" href="../styles/buttons.css">
  <link rel="stylesheet" href="../styles/forms.css">
  <link rel="stylesheet" href="../styles/overrides.css">
</head>
<body>

  <!-- Shared header injected by components.js -->
  <div id="header"></div>

  <main class="main-content">
    <section class="page-content">

      <h1>Admin – Create New Business</h1>
      <div class="clear"></div>

      <!-- Styled form using your forms.css classes -->
      <form id="businessForm" class="kc-form" onsubmit="event.preventDefault(); createBusiness();">
        <div class="form-group">
          <label for="businessName" class="form-label">Business Name <span class="req">*</span></label>
          <div class="input-wrap">
            <input id="businessName" class="kc-input" type="text" placeholder="Business Name" required autocomplete="organization" />
          </div>
        </div>

        <div class="form-group">
          <label for="contactEmail" class="form-label">Contact Email</label>
          <div class="input-wrap">
            <input id="contactEmail" class="kc-input" type="email" placeholder="Contact Email" autocomplete="email" />
          </div>
        </div>

        <div class="form-group">
          <label for="category" class="form-label">Category</label>
          <div class="input-wrap">
            <input id="category" class="kc-input" type="text" placeholder="Category" autocomplete="off" />
          </div>
        </div>

        <div class="form-group">
          <label for="subcategory" class="form-label">Subcategory (optional)</label>
          <div class="input-wrap">
            <input id="subcategory" class="kc-input" type="text" placeholder="Subcategory" autocomplete="off" />
          </div>
        </div>

        <div class="form-actions">
          <button type="submit" class="action-button">Add Business</button>
        </div>

        <p id="resultMessage" class="form-note"></p>
      </form>

      <!-- Back button styled -->
      <button class="action-button" type="button" onclick="window.location.href='admin_dashboard.html'">
        ← Back to Admin Dashboard
      </button>

    </section>
  </main>

  <!-- Shared footer injected by components.js -->
  <div id="footer"></div>

  <!-- Original module script (unchanged) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-app.js";
    import { firebaseConfig } from "../js/firebase-config.js";
    import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore.js";

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    async function createBusiness() {
      const resultDiv = document.getElementById("resultMessage");
      resultDiv.innerText = "Submitting...";

      const name = document.getElementById("businessName").value.trim();
      const email = document.getElementById("contactEmail").value.trim();
      const category = document.getElementById("category").value.trim();
      const subcategory = document.getElementById("subcategory").value.trim();

      if (!name) {
        resultDiv.innerText = "Business name is required.";
        return;
      }

      try {
        await addDoc(collection(db, "businesses"), {
          business_name: name,
          contact_email: email || "",
          category: category || "",
          subcategory: subcategory || "",
          created_at: serverTimestamp(),
          status: "pending"
        });
        resultDiv.innerText = "Business successfully added.";
        document.getElementById("businessForm").reset();
      } catch (err) {
        resultDiv.innerText = "Error adding business.";
        console.error(err);
      }
    }
  </script>

  <!-- Shared components (header/footer injector) -->
  <script src="../js/components.js" defer></script>
</body>
</html>
