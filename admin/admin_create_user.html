<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin – Create New User</title>

  <!-- Global CSS -->
  <link rel="stylesheet" href="../styles/layout.css">
  <link rel="stylesheet" href="../styles/theme.css">
  <link rel="stylesheet" href="../styles/buttons.css">
  <link rel="stylesheet" href="../styles/forms.css">
  <link rel="stylesheet" href="../styles/overrides.css">
</head>
<body>

  <!-- Header injected by components.js -->
  <div id="header" class="header"></div>

  <main class="main-content">
    <section class="page-content">
      <h1>Admin – Create New User</h1>
      <div class="clear"></div>

      <!-- Styled form using forms.css classes; IDs kept for JS -->
      <form id="userForm" class="kc-form" onsubmit="event.preventDefault(); createUser();">
        <div class="form-group">
          <label for="userName" class="form-label">Name <span class="req">*</span></label>
          <div class="input-wrap">
            <input type="text" id="userName" class="kc-input" placeholder="Full Name" required autocomplete="name" />
          </div>
        </div>

        <div class="form-group">
          <label for="userEmail" class="form-label">Email <span class="req">*</span></label>
          <div class="input-wrap">
            <input type="email" id="userEmail" class="kc-input" placeholder="Email Address" required autocomplete="email" />
          </div>
        </div>

        <div class="form-group">
          <label for="userRole" class="form-label">Role</label>
          <div class="input-wrap">
            <input type="text" id="userRole" class="kc-input" placeholder="Role (user/admin/moderator)" />
          </div>
        </div>

        <div class="form-actions">
          <button type="submit" class="action-button">Add User</button>
        </div>

        <p id="result" class="form-note"></p>
      </form>

      <!-- Back button -->
      <button class="action-button" type="button" onclick="window.location.href='admin_dashboard.html'">
        ← Back to Admin Dashboard
      </button>
    </section>
  </main>

  <!-- Footer injected by components.js -->
  <div id="footer" class="footer"></div>

  <!-- Ensure header/footer are injected first -->
  <script src="../js/components.js" defer></script>

  <!-- Original module script (unchanged) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-app.js";
    import { firebaseConfig } from "../js/firebase-config.js";
    import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore.js";

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    async function createUser() {
      const resultDiv = document.getElementById("result");
      resultDiv.innerText = "Submitting...";

      const name = document.getElementById("userName").value.trim();
      const email = document.getElementById("userEmail").value.trim();
      const role = document.getElementById("userRole").value.trim();

      if (!name || !email) {
        resultDiv.innerText = "Name and email are required.";
        return;
      }

      try {
        await addDoc(collection(db, "users"), {
          name,
          email,
          role: role || "user",
          created_at: serverTimestamp()
        });
        resultDiv.innerText = "User successfully added.";
        document.getElementById("userForm").reset();
      } catch (err) {
        resultDiv.innerText = "Error adding user.";
        console.error(err);
      }
    }
  </script>
</body>
</html>
