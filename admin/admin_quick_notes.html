<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin – Quick Notes</title>

  <!-- Global CSS -->
  <link rel="stylesheet" href="../styles/layout.css">
  <link rel="stylesheet" href="../styles/theme.css">
  <link rel="stylesheet" href="../styles/buttons.css">
  <link rel="stylesheet" href="../styles/forms.css">
  <link rel="stylesheet" href="../styles/overrides.css">
</head>

<body>

  <!-- Shared header -->
  <div id="header" class="header"></div>

  <main class="main-content">
    <section class="page-content">
      <h1>Admin – Quick Notes</h1>
      <div class="clear"></div>

      <div id="notesList" class="kc-list">
        <p>Loading admin notes...</p>
      </div>

      <div class="form-actions">
        <a class="action-button" href="./admin_dashboard.html">← Back to Admin Dashboard</a>
      </div>
    </section>
  </main>

  <!-- Shared footer -->
  <div id="footer" class="footer"></div>

  <!-- JS -->
  <script src="../js/components.js" defer></script>

  <!-- Firebase logic -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-app.js";
    import { firebaseConfig } from "../js/firebase-config.js";
    import { getFirestore, collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore.js";

    const app = initializeApp(firebaseConfig);
    const db  = getFirestore(app);

    const notesDiv = document.getElementById("notesList");

    async function loadNotes() {
      notesDiv.innerHTML = "<p>Loading admin notes...</p>";
      try {
        const q = query(collection(db, "admin_notes"), orderBy("timestamp", "desc"));
        const snapshot = await getDocs(q);

        if (snapshot.empty) {
          notesDiv.innerHTML = "<p>No notes found.</p>";
          return;
        }

        let html = "";
        snapshot.forEach((doc) => {
          const d = doc.data();
          const date = d.timestamp?.seconds
            ? new Date(d.timestamp.seconds * 1000).toLocaleString()
            : "N/A";

          html += `
            <div class="kc-card">
              <strong>${d.title || "Untitled Note"}</strong><br>
              ${d.content || ""}<br>
              <small>${date}</small>
            </div>`;
        });
        notesDiv.innerHTML = html;
      } catch (err) {
        console.error(err);
        notesDiv.innerHTML = "<p>Error loading notes.</p>";
      }
    }

    window.addEventListener("DOMContentLoaded", loadNotes);
  </script>
</body>
</html>
