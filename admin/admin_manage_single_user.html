<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin – Manage Single User</title>

  <!-- Global CSS -->
  <link rel="stylesheet" href="../styles/layout.css">
  <link rel="stylesheet" href="../styles/theme.css">
  <link rel="stylesheet" href="../styles/buttons.css">
  <link rel="stylesheet" href="../styles/forms.css">
  <link rel="stylesheet" href="../styles/overrides.css">
</head>

<body>

  <!-- Shared header -->
  <div id="header" class="header"></div>

  <main class="main-content">
    <section class="page-content">
      <h1>Admin – Manage Single User</h1>
      <div class="clear"></div>

      <div id="userDetails" class="kc-list">
        <p>Loading user details...</p>
      </div>

      <div class="form-actions">
        <a class="action-button" href="./admin_manage_users.html">← Back to User List</a>
      </div>
    </section>
  </main>

  <!-- Shared footer -->
  <div id="footer" class="footer"></div>

  <!-- JS -->
  <script src="../js/components.js" defer></script>

  <!-- Firebase logic -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-app.js";
    import { firebaseConfig } from "../js/firebase-config.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore.js";

    const app = initializeApp(firebaseConfig);
    const db  = getFirestore(app);

    const urlParams = new URLSearchParams(window.location.search);
    const userId = urlParams.get("id");
    const userDiv = document.getElementById("userDetails");

    async function loadUserDetails() {
      if (!userId) {
        userDiv.innerHTML = "<p>Error: No user ID provided in URL.</p>";
        return;
      }

      try {
        const ref = doc(db, "users", userId);
        const snap = await getDoc(ref);
        if (!snap.exists()) {
          userDiv.innerHTML = "<p>User not found.</p>";
          return;
        }

        const d = snap.data();
        userDiv.innerHTML = `
          <div class="kc-card">
            <strong>${d.name || "No Name"}</strong><br>
            <span>Email:</span> ${d.email || "N/A"}<br>
            <span>Role:</span> ${d.role || "N/A"}<br>
            <span>Status:</span> ${d.status || "N/A"}
          </div>`;
      } catch (err) {
        console.error(err);
        userDiv.innerHTML = "<p>Error loading user details.</p>";
      }
    }

    window.addEventListener("DOMContentLoaded", loadUserDetails);
  </script>
</body>
</html>
