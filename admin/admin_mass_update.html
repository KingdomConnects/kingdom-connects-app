<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin – Mass Update / Bulk Actions</title>

  <!-- Global CSS -->
  <link rel="stylesheet" href="../styles/layout.css">
  <link rel="stylesheet" href="../styles/theme.css">
  <link rel="stylesheet" href="../styles/buttons.css">
  <link rel="stylesheet" href="../styles/forms.css">
  <link rel="stylesheet" href="../styles/overrides.css">
</head>

<body>

  <!-- Shared header -->
  <div id="header" class="header"></div>

  <main class="main-content">
    <section class="page-content">
      <h1>Admin – Mass Update / Bulk Actions</h1>
      <div class="clear"></div>

      <div class="form-actions">
        <button class="action-button" id="bulkBusinesses">Approve All Pending Businesses</button>
        <button class="action-button" id="bulkChurches">Approve All Pending Churches</button>
        <button class="action-button" id="bulkReviews">Approve All Pending Reviews</button>
      </div>

      <div id="result" class="form-note" aria-live="polite"></div>

      <div class="form-actions">
        <a class="action-button" href="./admin_dashboard.html">← Back to Admin Dashboard</a>
      </div>
    </section>
  </main>

  <!-- Shared footer -->
  <div id="footer" class="footer"></div>

  <!-- JS -->
  <script src="../js/components.js" defer></script>

  <!-- Firebase logic -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-app.js";
    import { firebaseConfig } from "../js/firebase-config.js";
    import { getFirestore, collection, query, where, getDocs, writeBatch } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore.js";

    const app = initializeApp(firebaseConfig);
    const db  = getFirestore(app);

    const resultEl = document.getElementById("result");

    async function simulateBulk(collectionName) {
      resultEl.innerText = `Processing ${collectionName}...`;

      try {
        const q = query(collection(db, collectionName), where("status", "==", "pending"));
        const snapshot = await getDocs(q);

        if (snapshot.empty) {
          resultEl.innerText = `No pending ${collectionName} to approve.`;
          return;
        }

        const batch = writeBatch(db);
        snapshot.forEach(docSnap => {
          batch.update(docSnap.ref, { status: "approved" });
        });

        await batch.commit();
        resultEl.innerText = `Approved ${snapshot.size} ${collectionName}.`;
      } catch (err) {
        console.error(err);
        resultEl.innerText = `Error processing ${collectionName}.`;
      }
    }

    window.addEventListener("DOMContentLoaded", () => {
      document.getElementById("bulkBusinesses").addEventListener("click", () => simulateBulk("businesses"));
      document.getElementById("bulkChurches").addEventListener("click", () => simulateBulk("churches"));
      document.getElementById("bulkReviews").addEventListener("click", () => simulateBulk("reviews"));
    });
  </script>
</body>
</html>
