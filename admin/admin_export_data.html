<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin – Export Data</title>

  <!-- Global CSS -->
  <link rel="stylesheet" href="../styles/layout.css">
  <link rel="stylesheet" href="../styles/theme.css">
  <link rel="stylesheet" href="../styles/buttons.css">
  <link rel="stylesheet" href="../styles/forms.css">
  <link rel="stylesheet" href="../styles/overrides.css">
</head>
<body>

  <div id="header" class="header"></div>

  <main class="main-content">
    <section class="page-content">
      <h1>Admin – Export Data</h1>
      <div class="clear"></div>

      <!-- Full-width, spaced buttons -->
      <div class="button-stack">
        <button class="action-button" type="button" onclick="exportCollection('users')">Export Users</button>
        <button class="action-button" type="button" onclick="exportCollection('businesses')">Export Businesses</button>
        <button class="action-button" type="button" onclick="exportCollection('churches')">Export Churches</button>
        <button class="action-button" type="button" onclick="exportCollection('reviews')">Export Reviews</button>
      </div>

      <p id="status" class="form-note"></p>
      <pre id="output" class="code-output"></pre>

      <!-- Back button also full-width on mobile -->
      <div class="button-stack" style="margin-top:18px;">
        <button class="action-button" type="button" onclick="location.href='admin_dashboard.html'">
          ← Back to Admin Dashboard
        </button>
      </div>
    </section>
  </main>

  <div id="footer" class="footer"></div>

  <script src="../js/components.js" defer></script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-app.js";
    import { firebaseConfig } from "../js/firebase-config.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore.js";

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const output = document.getElementById("output");
    const status = document.getElementById("status");

    async function exportCollection(name) {
      status.textContent = "Exporting " + name + "...";
      output.textContent = "";

      try {
        const snap = await getDocs(collection(db, name));
        if (snap.empty) {
          status.textContent = "No records found in " + name + ".";
          return;
        }

        const records = [];
        snap.forEach((doc) => {
          const data = doc.data();
          data.id = doc.id;
          records.push(data);
        });

        output.textContent = JSON.stringify(records, null, 2);
        status.textContent = "Exported " + records.length + " record(s) from " + name + ".";
      } catch (err) {
        console.error(err);
        status.textContent = "Error exporting data.";
      }
    }

    window.exportCollection = exportCollection;
  </script>
</body>
</html>
