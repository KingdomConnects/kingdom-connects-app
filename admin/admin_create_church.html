<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin – Create New Church</title>

  <!-- Global CSS -->
  <link rel="stylesheet" href="../styles/layout.css">
  <link rel="stylesheet" href="../styles/theme.css">
  <link rel="stylesheet" href="../styles/buttons.css">
  <link rel="stylesheet" href="../styles/forms.css">
  <link rel="stylesheet" href="../styles/overrides.css">
</head>
<body>

  <!-- Header injected by components.js -->
  <div id="header"></div>

  <main class="main-content">
    <section class="page-content">
      <h1>Admin – Create New Church</h1>
      <div class="clear"></div>

      <!-- Styled form using forms.css hooks; IDs unchanged for JS -->
      <form id="churchForm" class="kc-form" onsubmit="event.preventDefault(); createChurch();">
        <div class="form-group">
          <label for="churchName" class="form-label">Church Name <span class="req">*</span></label>
          <div class="input-wrap">
            <input type="text" id="churchName" class="kc-input" placeholder="Church Name" required autocomplete="organization" />
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="city" class="form-label">City</label>
            <div class="input-wrap">
              <input type="text" id="city" class="kc-input" placeholder="City" autocomplete="address-level2" />
            </div>
          </div>
          <div class="form-group">
            <label for="state" class="form-label">State</label>
            <div class="input-wrap">
              <input type="text" id="state" class="kc-input" placeholder="State" autocomplete="address-level1" />
            </div>
          </div>
        </div>

        <div class="form-group">
          <label for="denomination" class="form-label">Denomination</label>
          <div class="input-wrap">
            <input type="text" id="denomination" class="kc-input" placeholder="Denomination" />
          </div>
        </div>

        <div class="form-group">
          <label for="description" class="form-label">Description</label>
          <div class="input-wrap">
            <textarea id="description" class="kc-input" placeholder="Optional description" rows="4"></textarea>
          </div>
        </div>

        <div class="form-actions">
          <button type="submit" class="action-button">Add Church</button>
        </div>

        <p id="statusMessage" class="form-note"></p>
      </form>

      <!-- Back button -->
      <button class="action-button" type="button" onclick="window.location.href='admin_dashboard.html'">
        ← Back to Admin Dashboard
      </button>
    </section>
  </main>

  <!-- Footer injected by components.js -->
  <div id="footer"></div>

  <!-- Original module script (unchanged) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-app.js";
    import { firebaseConfig } from "../js/firebase-config.js";
    import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore.js";

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    async function createChurch() {
      const msg = document.getElementById("statusMessage");
      msg.innerText = "Submitting...";

      const name = document.getElementById("churchName").value.trim();
      const city = document.getElementById("city").value.trim();
      const state = document.getElementById("state").value.trim();
      const denom = document.getElementById("denomination").value.trim();
      const desc = document.getElementById("description").value.trim();

      if (!name) {
        msg.innerText = "Church name is required.";
        return;
      }

      try {
        await addDoc(collection(db, "churches"), {
          church_name: name,
          city,
          state,
          denomination: denom,
          description: desc,
          created_at: serverTimestamp(),
          status: "pending"
        });
        msg.innerText = "Church added successfully.";
        document.getElementById("churchForm").reset();
      } catch (err) {
        msg.innerText = "Error adding church.";
        console.error(err);
      }
    }
  </script>

  <!-- Components injector -->
  <script src="../js/components.js" defer></script>
</body>
</html>
