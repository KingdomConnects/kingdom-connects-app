<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin – Moderate Reviews</title>

  <!-- Global CSS -->
  <link rel="stylesheet" href="../styles/layout.css">
  <link rel="stylesheet" href="../styles/theme.css">
  <link rel="stylesheet" href="../styles/buttons.css">
  <link rel="stylesheet" href="../styles/forms.css">
  <link rel="stylesheet" href="../styles/overrides.css">
</head>

<body>
  <!-- Shared header -->
  <div id="header" class="header"></div>

  <main class="main-content">
    <section class="page-content">
      <h1>Admin – Moderate Reviews</h1>
      <div class="clear"></div>

      <div id="reviewList" class="kc-list">
        <p>Loading pending reviews...</p>
      </div>

      <div class="form-actions">
        <a class="action-button" href="./admin_dashboard.html">← Back to Admin Dashboard</a>
      </div>
    </section>
  </main>

  <!-- Shared footer -->
  <div id="footer" class="footer"></div>

  <!-- JS -->
  <script src="../js/components.js" defer></script>

  <!-- Firebase logic -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-app.js";
    import { firebaseConfig } from "../js/firebase-config.js";
    import { getFirestore, collection, getDocs, query, where, doc, updateDoc } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore.js";

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const list = document.getElementById("reviewList");

    async function loadPendingReviews() {
      list.innerHTML = "<p>Loading pending reviews...</p>";
      try {
        const q = query(collection(db, "reviews"), where("status", "==", "pending"));
        const snapshot = await getDocs(q);

        if (snapshot.empty) {
          list.innerHTML = "<p>No pending reviews.</p>";
          return;
        }

        let html = "";
        snapshot.forEach((docSnap) => {
          const data = docSnap.data();
          const id = docSnap.id;
          html += `
            <div class="kc-card">
              <strong>${data.business_name || "Unknown Business"}</strong><br>
              <span>Rating:</span> ${data.rating || "N/A"}<br>
              <span>Comment:</span> ${data.comment || ""}<br>
              <div class="form-actions">
                <button class="action-button approve" data-id="${id}" data-status="approved">Approve</button>
                <button class="action-button reject" data-id="${id}" data-status="rejected">Reject</button>
              </div>
            </div>`;
        });
        list.innerHTML = html;
      } catch (err) {
        console.error(err);
        list.innerHTML = "<p>Error loading reviews.</p>";
      }
    }

    async function moderate(id, newStatus) {
      try {
        const ref = doc(db, "reviews", id);
        await updateDoc(ref, { status: newStatus });
        alert(`Review ${newStatus}`);
        loadPendingReviews();
      } catch (err) {
        console.error(err);
        alert("Error updating review.");
      }
    }

    window.addEventListener("DOMContentLoaded", () => {
      loadPendingReviews();

      // delegate events for approve/reject
      list.addEventListener("click", (e) => {
        const btn = e.target.closest("button[data-id]");
        if (!btn) return;
        const id = btn.getAttribute("data-id");
        const status = btn.getAttribute("data-status");
        moderate(id, status);
      });
    });
  </script>
</body>
</html>
