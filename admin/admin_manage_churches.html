<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin – Manage Church</title>

  <!-- Global CSS (relative to /admin/) -->
  <link rel="stylesheet" href="../styles/layout.css">
  <link rel="stylesheet" href="../styles/theme.css">
  <link rel="stylesheet" href="../styles/buttons.css">
  <link rel="stylesheet" href="../styles/forms.css">
  <link rel="stylesheet" href="../styles/overrides.css">
</head>
<body>

  <!-- Shared header injected by components.js -->
  <div id="header" class="header"></div>

  <main class="main-content">
    <section class="page-content">
      <h1>Admin – Manage Church</h1>
      <div class="clear"></div>

      <!-- Edit Church Form -->
      <form id="churchForm" class="kc-form">
        <div class="form-group">
          <label for="church_name">Church Name</label>
          <div class="input-wrap">
            <input id="church_name" class="kc-input" type="text" autocomplete="organization" />
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="city">City</label>
            <div class="input-wrap">
              <input id="city" class="kc-input" type="text" autocomplete="address-level2" />
            </div>
          </div>

          <div class="form-group">
            <label for="state">State</label>
            <div class="input-wrap">
              <input id="state" class="kc-input" type="text" autocomplete="address-level1" />
            </div>
          </div>
        </div>

        <div class="form-group">
          <label for="denomination">Denomination</label>
          <div class="input-wrap">
            <input id="denomination" class="kc-input" type="text" />
          </div>
        </div>

        <div class="form-group">
          <label for="website">Website</label>
          <div class="input-wrap">
            <!-- keep as text to avoid native URL scheme errors (per project choice) -->
            <input id="website" class="kc-input" type="text" placeholder="example.com" inputmode="url" />
          </div>
          <p class="form-note">Enter just the domain if you’d like (e.g., <em>example.com</em>).</p>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="contact_email">Contact Email</label>
            <div class="input-wrap">
              <input id="contact_email" class="kc-input" type="email" autocomplete="email" />
            </div>
          </div>

          <div class="form-group">
            <label for="contact_phone">Contact Phone</label>
            <div class="input-wrap">
              <input id="contact_phone" class="kc-input" type="tel" autocomplete="tel" />
            </div>
          </div>
        </div>

        <div id="statusMessage" class="form-note" aria-live="polite"></div>

        <div class="form-actions">
          <button type="submit" class="action-button">Save Church</button>
          <a class="action-button" href="./admin_manage_churches.html">← Back to Church List</a>
        </div>
      </form>
    </section>
  </main>

  <!-- Shared footer injected by components.js -->
  <div id="footer" class="footer"></div>

  <!-- Components injector -->
  <script src="../js/components.js" defer></script>

  <!-- Firebase logic (unchanged behavior, no inline handlers) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-app.js";
    import { firebaseConfig } from "../js/firebase-config.js";
    import { getFirestore, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore.js";

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const params = new URLSearchParams(window.location.search);
    const churchId = params.get("id");

    const form   = document.getElementById("churchForm");
    const msgEl  = document.getElementById("statusMessage");

    const nameEl   = document.getElementById("church_name");
    const cityEl   = document.getElementById("city");
    const stateEl  = document.getElementById("state");
    const denomEl  = document.getElementById("denomination");
    const webEl    = document.getElementById("website");
    const emailEl  = document.getElementById("contact_email");
    const phoneEl  = document.getElementById("contact_phone");

    function say(t) { msgEl.textContent = t; }

    async function loadChurch() {
      if (!churchId) { say("No church ID provided."); return; }
      try {
        const ref = doc(db, "churches", churchId);
        const snap = await getDoc(ref);
        if (!snap.exists()) { say("Church not found."); return; }
        const d = snap.data();
        nameEl.value  = d.church_name   || "";
        cityEl.value  = d.city          || "";
        stateEl.value = d.state         || "";
        denomEl.value = d.denomination  || "";
        webEl.value   = d.website       || "";
        emailEl.value = d.contact_email || "";
        phoneEl.value = d.contact_phone || "";
        say("");
      } catch (err) {
        console.error(err);
        say("Error loading church.");
      }
    }

    async function saveChurch(e) {
      e.preventDefault();
      if (!churchId) { say("No church ID found."); return; }
      try {
        const ref = doc(db, "churches", churchId);
        await updateDoc(ref, {
          church_name:   nameEl.value.trim(),
          city:          cityEl.value.trim(),
          state:         stateEl.value.trim(),
          denomination:  denomEl.value.trim(),
          website:       webEl.value.trim(),
          contact_email: emailEl.value.trim(),
          contact_phone: phoneEl.value.trim()
        });
        say("Church info saved.");
      } catch (err) {
        console.error(err);
        say("Failed to save changes.");
      }
    }

    window.addEventListener("DOMContentLoaded", () => {
      form.addEventListener("submit", saveChurch);
      loadChurch();
    });
  </script>
</body>
</html>
