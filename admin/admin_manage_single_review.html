<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin – Manage Single Review</title>

  <!-- Global CSS -->
  <link rel="stylesheet" href="../styles/layout.css">
  <link rel="stylesheet" href="../styles/theme.css">
  <link rel="stylesheet" href="../styles/buttons.css">
  <link rel="stylesheet" href="../styles/forms.css">
  <link rel="stylesheet" href="../styles/overrides.css">
</head>

<body>

  <!-- Shared header -->
  <div id="header" class="header"></div>

  <main class="main-content">
    <section class="page-content">
      <h1>Admin – Manage Single Review</h1>
      <div class="clear"></div>

      <div id="reviewDetails" class="kc-list">
        <p>Loading review details...</p>
      </div>

      <div class="form-actions">
        <a class="action-button" href="./admin_manage_reviews.html">← Back to Reviews</a>
      </div>
    </section>
  </main>

  <!-- Shared footer -->
  <div id="footer" class="footer"></div>

  <!-- JS -->
  <script src="../js/components.js" defer></script>

  <!-- Firebase logic -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-app.js";
    import { firebaseConfig } from "../js/firebase-config.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore.js";

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const urlParams = new URLSearchParams(window.location.search);
    const reviewId = urlParams.get("id");
    const detailsDiv = document.getElementById("reviewDetails");

    async function loadReviewDetails() {
      if (!reviewId) {
        detailsDiv.innerHTML = "<p>Error: No review ID provided.</p>";
        return;
      }
      try {
        const ref = doc(db, "reviews", reviewId);
        const snap = await getDoc(ref);
        if (!snap.exists()) {
          detailsDiv.innerHTML = "<p>Review not found.</p>";
          return;
        }
        const d = snap.data();
        const t = d.timestamp?.seconds ? new Date(d.timestamp.seconds * 1000).toLocaleString() : "N/A";
        detailsDiv.innerHTML = `
          <div class="kc-card">
            <strong>${d.business_name || "Unknown Business"}</strong><br>
            <span>Rating:</span> ${d.rating ?? "N/A"}<br>
            <span>Comment:</span> ${d.comment || "No comment"}<br>
            <span>Status:</span> ${d.status || "N/A"}<br>
            <span>Submitted:</span> ${t}<br>
          </div>`;
      } catch (err) {
        console.error(err);
        detailsDiv.innerHTML = "<p>Error loading review details.</p>";
      }
    }

    window.addEventListener("DOMContentLoaded", loadReviewDetails);
  </script>
</body>
</html>
