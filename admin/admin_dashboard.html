<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin Dashboard – Kingdom Connects</title>

  <!-- CSS: one level up from /admin/ -->
  <link rel="stylesheet" href="../styles/layout.css">
  <link rel="stylesheet" href="../styles/theme.css">
  <link rel="stylesheet" href="../styles/buttons.css">
  <link rel="stylesheet" href="../styles/forms.css">
  <link rel="stylesheet" href="../styles/overrides.css">
</head>

<body>
  <!-- Minimal header (no JS injection to avoid Acode bounce) -->
  <div class="header">
    <div class="header-content" style="display:flex;align-items:center;gap:.75rem;padding:.75rem 1rem;">
      <img src="..//kingdom-connects-logo.png" alt="Kingdom Connects" style="height:44px;">
      <h1 style="margin:0;font-size:1.25rem;">Kingdom Connects — Admin</h1>
      <div style="margin-left:auto;">
        <a class="action-button" href="../index.html" style="text-decoration:none;">← Back to Site</a>
      </div>
    </div>
  </div>

  <main class="main-content">
    <section class="page-content">
      <div class="card">
        <h2 class="gold-metallic">Admin Dashboard</h2>
        <p>Select an area to manage.</p>

        <div class="admin-grid">
          <button class="action-button" onclick="location.href='admin_manage_churches.html'">Manage Churches</button>
          <button class="action-button" onclick="location.href='admin_manage_businesses.html'">Manage Businesses</button>
          <button class="action-button" onclick="location.href='admin_pending_submissions.html'">Pending Submissions</button>
          <button class="action-button" onclick="location.href='admin_moderate_reviews.html'">Moderate Reviews</button>
          <button class="action-button" onclick="location.href='admin_users.html'">Manage Users</button>
          <button class="action-button" onclick="location.href='admin_settings.html'">Site Settings</button>
        </div>
      </div>
    </section>
  </main>

  <div class="footer" style="text-align:center;padding:1rem 0;">
    <small>© 2025 Kingdom Connects</small>
  </div>

  <!-- Optional: tiny CSS helpers if .admin-grid isn’t defined yet -->
  <style>
    .admin-grid{display:grid;gap:1rem;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));margin-top:1rem}
  </style>
</body>
</html>
