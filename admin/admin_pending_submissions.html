<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin – Pending Submissions</title>

  <!-- Global CSS -->
  <link rel="stylesheet" href="../styles/layout.css">
  <link rel="stylesheet" href="../styles/theme.css">
  <link rel="stylesheet" href="../styles/buttons.css">
  <link rel="stylesheet" href="../styles/forms.css">
  <link rel="stylesheet" href="../styles/overrides.css">
</head>

<body>

  <!-- Shared header -->
  <div id="header" class="header"></div>

  <main class="main-content">
    <section class="page-content">
      <h1>Admin – Pending Submissions Overview</h1>
      <div class="clear"></div>

      <div id="pendingCounts" class="kc-list">
        <p>Loading pending submission counts...</p>
      </div>

      <div class="form-actions">
        <a class="action-button" href="./admin_dashboard.html">← Back to Admin Dashboard</a>
      </div>
    </section>
  </main>

  <!-- Shared footer -->
  <div id="footer" class="footer"></div>

  <!-- JS -->
  <script src="../js/components.js" defer></script>

  <!-- Firebase logic -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-app.js";
    import { firebaseConfig } from "../js/firebase-config.js";
    import { getFirestore, collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore.js";

    const app = initializeApp(firebaseConfig);
    const db  = getFirestore(app);

    async function loadPendingCounts() {
      const div = document.getElementById("pendingCounts");
      div.innerHTML = "<p>Loading pending submission counts...</p>";

      try {
        const churchesSnap = await getDocs(query(collection(db, "churches"), where("status", "==", "pending")));
        const businessesSnap = await getDocs(query(collection(db, "businesses"), where("status", "==", "pending")));
        const reviewsSnap = await getDocs(query(collection(db, "reviews"), where("status", "==", "pending")));

        const churchCount = churchesSnap.size;
        const businessCount = businessesSnap.size;
        const reviewCount = reviewsSnap.size;

        div.innerHTML = `
          <div class="kc-card">
            <strong>Pending Churches:</strong> ${churchCount}
          </div>
          <div class="kc-card">
            <strong>Pending Businesses:</strong> ${businessCount}
          </div>
          <div class="kc-card">
            <strong>Pending Reviews:</strong> ${reviewCount}
          </div>`;
      } catch (err) {
        console.error(err);
        div.innerHTML = "<p>Error loading pending submission counts.</p>";
      }
    }

    window.addEventListener("DOMContentLoaded", loadPendingCounts);
  </script>
</body>
</html>
