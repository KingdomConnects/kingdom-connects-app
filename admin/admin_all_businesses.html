<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin – All Businesses</title>

  <!-- Global CSS (one level up from /admin/) -->
  <link rel="stylesheet" href="../styles/layout.css">
  <link rel="stylesheet" href="../styles/theme.css">
  <link rel="stylesheet" href="../styles/buttons.css">
  <link rel="stylesheet" href="../styles/forms.css">
  <link rel="stylesheet" href="../styles/overrides.css">
</head>
<body>

  <!-- Shared header injected by components.js -->
  <div id="header"></div>

  <main class="main-content">
    <section class="page-content">

      <!-- page content preserved (logo removed; header injects branding) -->
      <h1>Admin – All Businesses</h1>

      <div class="clear"></div>

      <div id="businessList">
        <p>Loading businesses...</p>
      </div>

      <!-- Styled back button -->
      <button class="action-button" type="button" onclick="window.location.href='admin_dashboard.html'">
        ← Back to Admin Dashboard
      </button>

    </section>
  </main>

  <!-- Shared footer injected by components.js -->
  <div id="footer"></div>

  <!-- Original module script (unchanged) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-app.js";
    import { firebaseConfig } from "../js/firebase-config.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore.js";

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    async function loadBusinesses() {
      const list = document.getElementById("businessList");
      list.innerHTML = "<p>Loading businesses...</p>";

      try {
        const querySnapshot = await getDocs(collection(db, "businesses"));
        let html = "";
        querySnapshot.forEach((doc) => {
          const data = doc.data();
          html += `<div class="business-card">
              <strong>${data.business_name}</strong><br>
              ${data.city || ""}, ${data.state || ""}<br>
              Status: ${data.status || "N/A"}
              <hr></div>`;
        });
        list.innerHTML = html || "<p>No businesses found.</p>";
      } catch (err) {
        list.innerHTML = "Error loading businesses.";
        console.error(err);
      }
    }

    window.addEventListener("DOMContentLoaded", loadBusinesses);
  </script>

  <!-- Shared components (header/footer injector) -->
  <script src="../js/components.js" defer></script>
</body>
</html>
