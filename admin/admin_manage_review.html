<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin – Manage Reviews</title>

  <!-- Global CSS (relative to /admin/) -->
  <link rel="stylesheet" href="../styles/layout.css">
  <link rel="stylesheet" href="../styles/theme.css">
  <link rel="stylesheet" href="../styles/buttons.css">
  <link rel="stylesheet" href="../styles/forms.css">
  <link rel="stylesheet" href="../styles/overrides.css">
</head>
<body>

  <!-- Shared header injected by components.js -->
  <div id="header" class="header"></div>

  <main class="main-content">
    <section class="page-content">
      <h1>Admin – Manage Reviews</h1>
      <div class="clear"></div>

      <!-- Filter -->
      <form class="kc-form" onsubmit="return false;">
        <div class="form-group">
          <label for="statusFilter">Filter by Status</label>
          <div class="input-wrap">
            <select id="statusFilter" class="kc-input">
              <option value="all">All</option>
              <option value="pending">Pending</option>
              <option value="approved">Approved</option>
              <option value="rejected">Rejected</option>
            </select>
          </div>
        </div>
      </form>

      <!-- List -->
      <div id="reviewList" class="kc-list">
        <p>Loading reviews...</p>
      </div>

      <!-- Actions -->
      <div class="form-actions">
        <a class="action-button" href="./admin_dashboard.html">← Back to Admin Dashboard</a>
      </div>
    </section>
  </main>

  <!-- Shared footer injected by components.js -->
  <div id="footer" class="footer"></div>

  <!-- Components injector -->
  <script src="../js/components.js" defer></script>

  <!-- Firebase logic -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-app.js";
    import { firebaseConfig } from "../js/firebase-config.js";
    import { getFirestore, collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore.js";

    const app = initializeApp(firebaseConfig);
    const db  = getFirestore(app);

    const listEl   = document.getElementById("reviewList");
    const filterEl = document.getElementById("statusFilter");

    function showMessage(msg) {
      listEl.innerHTML = `<p>${msg}</p>`;
    }

    async function loadReviews() {
      const filter = filterEl.value;
      showMessage("Loading reviews...");

      try {
        let qRef = collection(db, "reviews");
        if (filter !== "all") qRef = query(qRef, where("status", "==", filter));

        const snap = await getDocs(qRef);
        let html = "";
        snap.forEach((docSnap) => {
          const d = docSnap.data();
          html += `
            <div class="kc-card">
              <strong>${d.business_name || "Unknown Business"}</strong><br>
              <span>Rating:</span> ${d.rating ?? "N/A"}<br>
              <span>Comment:</span> ${d.comment || ""}<br>
              <span>Status:</span> ${d.status || "N/A"}
            </div>`;
        });
        listEl.innerHTML = html || "<p>No reviews found.</p>";
      } catch (err) {
        console.error(err);
        showMessage("Error loading reviews. Check console for details.");
      }
    }

    window.addEventListener("DOMContentLoaded", () => {
      filterEl.addEventListener("change", loadReviews);
      loadReviews();
    });
  </script>
</body>
</html>
