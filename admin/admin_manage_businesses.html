<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin – Manage Businesses</title>

  <!-- Global CSS (relative to /admin/) -->
  <link rel="stylesheet" href="../styles/layout.css">
  <link rel="stylesheet" href="../styles/theme.css">
  <link rel="stylesheet" href="../styles/buttons.css">
  <link rel="stylesheet" href="../styles/forms.css">
  <link rel="stylesheet" href="../styles/overrides.css">
</head>
<body>

  <!-- Shared header injected by components.js -->
  <div id="header" class="header"></div>

  <main class="main-content">
    <section class="page-content">
      <h1>Admin – Manage Businesses</h1>
      <div class="clear"></div>

      <!-- Filter -->
      <form class="kc-form" onsubmit="return false;">
        <div class="form-group">
          <label for="statusFilter">Filter by Status</label>
          <div class="input-wrap">
            <!-- NOTE: removed inline onchange -->
            <select id="statusFilter" class="kc-input">
              <option value="all">All</option>
              <option value="pending">Pending</option>
              <option value="active">Active</option>
              <option value="inactive">Inactive</option>
            </select>
          </div>
        </div>
      </form>

      <!-- List -->
      <div id="businessList" class="kc-list">
        <p>Loading businesses...</p>
      </div>

      <!-- Actions -->
      <div class="form-actions">
        <button class="action-button" type="button" onclick="window.location.href='admin_dashboard.html'">
          ← Back to Admin Dashboard
        </button>
      </div>
    </section>
  </main>

  <!-- Shared footer injected by components.js -->
  <div id="footer" class="footer"></div>

  <!-- Components injector -->
  <script src="../js/components.js" defer></script>

  <!-- Firebase logic -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-app.js";
    import { firebaseConfig } from "../js/firebase-config.js";
    import { getFirestore, collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore.js";

    // init
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const listEl   = document.getElementById("businessList");
    const filterEl = document.getElementById("statusFilter");

    function showMessage(html) {
      listEl.innerHTML = `<p>${html}</p>`;
    }

    async function loadBusinesses() {
      const filter = filterEl.value;
      showMessage("Loading businesses...");

      try {
        let qRef = collection(db, "businesses");
        if (filter !== "all") {
          qRef = query(qRef, where("status", "==", filter));
        }

        const snapshot = await getDocs(qRef);
        let html = "";
        snapshot.forEach((docSnap) => {
          const data = docSnap.data();
          html += `
            <div class="kc-card">
              <strong>${data.business_name || "Unnamed Business"}</strong><br>
              ${data.city || ""}${data.city && data.state ? ", " : ""}${data.state || ""}<br>
              <span>Status:</span> ${data.status || "N/A"}
            </div>`;
        });

        listEl.innerHTML = html || "<p>No businesses found.</p>";
      } catch (err) {
        console.error(err);
        showMessage("Error loading businesses. Check console for details.");
      }
    }

    // Bind after DOM ready
    window.addEventListener("DOMContentLoaded", () => {
      filterEl.addEventListener("change", loadBusinesses);
      loadBusinesses();
    });
  </script>
</body>
</html>
