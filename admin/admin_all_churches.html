
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin – All Churches</title>

  <!-- Global CSS (one level up from /admin/) -->
  <link rel="stylesheet" href="../styles/layout.css">
  <link rel="stylesheet" href="../styles/theme.css">
  <link rel="stylesheet" href="../styles/buttons.css">
  <link rel="stylesheet" href="../styles/forms.css">
  <link rel="stylesheet" href="../styles/overrides.css">
</head>
<body>

  <!-- Shared header injected by components.js -->
  <div id="header"></div>

  <main class="main-content">
    <section class="page-content">

      <h1>Admin – All Churches</h1>

      <div class="clear"></div>

      <!-- Styled back button -->
      <button class="action-button" type="button" onclick="location.href='admin_dashboard.html'">
        ← Back to Admin Dashboard
      </button>

      <div id="churchList">
        <p>Loading churches...</p>
      </div>

    </section>
  </main>

  <!-- Shared footer injected by components.js -->
  <div id="footer"></div>

  <!-- Original module script (unchanged) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-app.js";
    import { firebaseConfig } from "../js/firebase-config.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore.js";

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    async function loadChurches() {
      const list = document.getElementById("churchList");
      list.innerHTML = "<p>Loading churches...</p>";

      try {
        const snapshot = await getDocs(collection(db, "churches"));
        let html = "";
        snapshot.forEach((docSnap) => {
          const data = docSnap.data();
          html += `<div class="business-card">
              <strong>${data.church_name || "Unnamed Church"}</strong><br>
              ${data.city || ""}, ${data.state || ""}<br>
              Denomination: ${data.denomination || "N/A"}
              <hr></div>`;
        });
        list.innerHTML = html || "<p>No churches found.</p>";
      } catch (err) {
        list.innerHTML = "Error loading churches.";
        console.error(err);
      }
    }

    window.addEventListener("DOMContentLoaded", loadChurches);
  </script>

  <!-- Shared components (header/footer injector) -->
  <script src="../js/components.js" defer></script>
</body>
</html>
